# Public install check for the DeliverProof Scaffold-HBAR template.
#
# Runs the official create-scaffold-hbar CLI against the public repository on a
# GitHub-hosted runner, then runs the documented checks in the generated app,
# including lint with zero warnings allowed, and finally boots the production
# app on 127.0.0.1 and checks its HTTP responses.
# It uses no secrets, deploys nothing, uploads nothing to IPFS and never uses
# the CLI's local template override. It lives only on the validation branch:
# the push that publishes this branch starts the run (workflow_dispatch alone
# would require the file on the default branch).

name: Public install check

on:
  push:
    branches: [validation/public-install]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Full SHA that main of the template repository must have before and after the install'
        required: true
        default: '717442e78e4c406e70bda79acf61274fcb74aee9'
      cli_version:
        description: 'create-scaffold-hbar version: latest or x.y.z'
        required: true
        default: '0.4.1'

permissions:
  contents: read

concurrency:
  group: public-install-check
  cancel-in-progress: false

env:
  TEMPLATE_REPO: rafaorlando3/deliverproof
  EXPECTED_SHA: ${{ inputs.expected_sha || '717442e78e4c406e70bda79acf61274fcb74aee9' }}
  CLI_VERSION: ${{ inputs.cli_version || '0.4.1' }}
  NODE_VERSION: '22.22.2'
  NEXT_TELEMETRY_DISABLED: '1'

defaults:
  run:
    shell: bash

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Guard inputs and record versions
        run: |
          set -euo pipefail
          E="$GITHUB_WORKSPACE/evidence"
          mkdir -p "$E"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::expected_sha must be 40 lowercase hex characters"; exit 1; }
          [[ "$CLI_VERSION" =~ ^(latest|[0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "::error::cli_version must be latest or x.y.z"; exit 1; }
          if [ -n "${CREATE_SCAFFOLD_HBAR_TEMPLATE_DIR+x}" ]; then
            echo "::error::CREATE_SCAFFOLD_HBAR_TEMPLATE_DIR is set; this check must download the public template"
            exit 1
          fi
          # The CLI creates an initial commit and checks that a git identity exists.
          git config --global user.name "public-install-check"
          git config --global user.email "public-install-check@users.noreply.github.com"
          {
            echo "date_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner_image=${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "kernel=$(uname -srm)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "git=$(git --version)"
            echo "template_repo=$TEMPLATE_REPO"
            echo "expected_sha=$EXPECTED_SHA"
            echo "cli_spec=create-scaffold-hbar@$CLI_VERSION"
            echo "local_override=unset"
            echo "workflow_commit=$GITHUB_SHA"
            echo "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
          } | tee "$E/01-context.txt"
          npm view "create-scaffold-hbar@$CLI_VERSION" version dist.integrity dist.shasum --json | tee "$E/02-cli-registry-before.json"

      - name: Check the public origin before the install
        run: |
          set -euo pipefail
          E="$GITHUB_WORKSPACE/evidence"
          git ls-remote "https://github.com/$TEMPLATE_REPO.git" HEAD refs/heads/main | tee "$E/03-origin-before.txt"
          got=$(awk '$2 == "refs/heads/main" { print $1 }' "$E/03-origin-before.txt")
          if [ "$got" != "$EXPECTED_SHA" ]; then
            echo "::error::main of $TEMPLATE_REPO is ${got:-missing}, expected $EXPECTED_SHA"
            exit 1
          fi

      - name: Install with the official CLI (public template, no override)
        id: cli
        run: |
          set -uo pipefail
          # shell: bash runs with -e; turn it off so the log is sanitized and the exit recorded.
          set +e
          E="$GITHUB_WORKSPACE/evidence"
          sanitize() {
            sed -E \
              -e 's/\x1b\[[0-9;?]*[A-Za-z]//g' \
              -e 's/([Pp]rivate[ _-]?[Kk]ey[^0-9A-Fa-f]{0,20})(0x)?[0-9A-Fa-f]{64}/\1[REDACTED]/g' \
              -e 's/(gh[pousr]_|github_pat_)[A-Za-z0-9_]{20,}/[REDACTED]/g' \
              -e 's/npm_[A-Za-z0-9]{36}/[REDACTED]/g' "$1"
          }
          mkdir -p "$RUNNER_TEMP/gen"
          cd "$RUNNER_TEMP/gen"
          npx -y "create-scaffold-hbar@$CLI_VERSION" deliverproof-app --template "$TEMPLATE_REPO" -f nextjs-app -s hardhat --network testnet --package-manager npm --skip-hedera-skills --ci > "$E/04-cli-install.raw" 2>&1
          rc=$?
          sanitize "$E/04-cli-install.raw" > "$E/04-cli-install.log"
          rm -f "$E/04-cli-install.raw"
          cat "$E/04-cli-install.log"
          echo "cli_exit=$rc" | tee "$E/05-cli-exit.txt"
          exit "$rc"

      - name: Check the public origin after the install
        run: |
          set -euo pipefail
          E="$GITHUB_WORKSPACE/evidence"
          git ls-remote "https://github.com/$TEMPLATE_REPO.git" HEAD refs/heads/main | tee "$E/06-origin-after.txt"
          got=$(awk '$2 == "refs/heads/main" { print $1 }' "$E/06-origin-after.txt")
          if [ "$got" != "$EXPECTED_SHA" ]; then
            echo "::error::main of $TEMPLATE_REPO changed during the run: ${got:-missing}, expected $EXPECTED_SHA"
            exit 1
          fi

      - name: Record the generated tree and compare it with the template SHA
        run: |
          set -euo pipefail
          E="$GITHUB_WORKSPACE/evidence"
          APP="$RUNNER_TEMP/gen/deliverproof-app"
          T="$RUNNER_TEMP/template"
          test -f "$APP/package.json" || { echo "::error::the CLI did not create deliverproof-app/package.json"; exit 1; }
          cd "$APP"
          find . \( -name node_modules -o -name .git \) -prune -o -type f -print | sed 's|^\./||' | LC_ALL=C sort > "$E/07-generated-files.txt"
          tr '\n' '\0' < "$E/07-generated-files.txt" | xargs -0 sha256sum > "$E/08-generated.sha256"
          git log -1 --format='%H %s' > "$E/09-cli-initial-commit.txt" 2>&1 || echo "no git commit created by the CLI" > "$E/09-cli-initial-commit.txt"
          git init -q "$T"
          git -C "$T" fetch -q --depth 1 "https://github.com/$TEMPLATE_REPO.git" "$EXPECTED_SHA"
          git -C "$T" checkout -q FETCH_HEAD
          test "$(git -C "$T" rev-parse HEAD)" = "$EXPECTED_SHA"
          git -C "$T" ls-files | LC_ALL=C sort > "$E/10-template-files.txt"
          {
            echo "# Template $TEMPLATE_REPO@$EXPECTED_SHA versus the tree generated by the CLI"
            echo "# Report only: the CLI is expected to transform some files (see docs/INSTALL.md)."
            echo "## Only in the template"
            LC_ALL=C comm -23 "$E/10-template-files.txt" "$E/07-generated-files.txt"
            echo "## Only in the generated tree"
            LC_ALL=C comm -13 "$E/10-template-files.txt" "$E/07-generated-files.txt"
            echo "## Present in both, different bytes"
            LC_ALL=C comm -12 "$E/10-template-files.txt" "$E/07-generated-files.txt" | while IFS= read -r f; do
              cmp -s "$T/$f" "$APP/$f" || echo "$f"
            done
          } > "$E/11-template-vs-generated.txt"
          LC_ALL=C comm -12 "$E/10-template-files.txt" "$E/07-generated-files.txt" | while IFS= read -r f; do
            if [ "$f" != "package-lock.json" ] && ! cmp -s "$T/$f" "$APP/$f"; then
              diff -u --label "template/$f" --label "generated/$f" "$T/$f" "$APP/$f" || true
            fi
          done > "$E/11-template-vs-generated.diff"
          {
            echo "generated_files=$(wc -l < "$E/07-generated-files.txt")"
            echo "generated_tree_sha256=$(sha256sum < "$E/08-generated.sha256" | cut -c1-64)"
            echo "template_files=$(wc -l < "$E/10-template-files.txt")"
            echo "package_name=$(node -p 'require("./package.json").name')"
          } | tee "$E/12-tree-summary.txt"
          cat "$E/11-template-vs-generated.txt"

      - name: Run the documented checks in the generated app
        id: checks
        run: |
          set -uo pipefail
          # shell: bash runs with -e; turn it off so every check runs and every log is sanitized.
          set +e
          E="$GITHUB_WORKSPACE/evidence"
          sanitize() {
            sed -E \
              -e 's/\x1b\[[0-9;?]*[A-Za-z]//g' \
              -e 's/([Pp]rivate[ _-]?[Kk]ey[^0-9A-Fa-f]{0,20})(0x)?[0-9A-Fa-f]{64}/\1[REDACTED]/g' \
              -e 's/(gh[pousr]_|github_pat_)[A-Za-z0-9_]{20,}/[REDACTED]/g' \
              -e 's/npm_[A-Za-z0-9]{36}/[REDACTED]/g' "$1"
          }
          cd "$RUNNER_TEMP/gen/deliverproof-app"
          fail=0
          : > "$E/13-checks.txt"
          # AGENTS.md also requires clean lockfile install, frontend types before/after build, and formatting.
          for phase in ci check next:lint core:test hardhat:test next:check-before-build next:build next:check-after-build chain:test format:check; do
            s="$phase"
            case "$phase" in next:check-before-build|next:check-after-build) s="next:check" ;; esac
            n="14-${phase//:/-}"
            start=$(date +%s)
            if [ "$s" = "ci" ]; then
              npm ci > "$E/$n.raw" 2>&1
            else
              npm run "$s" > "$E/$n.raw" 2>&1
            fi
            rc=$?
            sanitize "$E/$n.raw" > "$E/$n.log"
            rm -f "$E/$n.raw"
            command="npm run $s"; [ "$s" != "ci" ] || command="npm ci"
            echo "$command phase=$phase exit=$rc seconds=$(( $(date +%s) - start ))" | tee -a "$E/13-checks.txt"
            echo "::group::npm run $s (exit $rc)"
            cat "$E/$n.log"
            echo "::endgroup::"
            [ "$rc" -eq 0 ] || fail=1
          done
          exit "$fail"

      - name: Boot the production app on 127.0.0.1 and check its responses
        id: boot
        if: ${{ !cancelled() && steps.cli.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          set -uo pipefail
          # GitHub runs `shell: bash` with -e; every check below handles its own status.
          set +e
          E="$GITHUB_WORKSPACE/evidence"
          mkdir -p "$E"
          APP="$RUNNER_TEMP/gen/deliverproof-app"
          OUT="$E/17-boot-check.txt"
          RAW="$RUNNER_TEMP/boot-server.raw"
          PORT=3000
          BASE="http://127.0.0.1:$PORT"
          TITLE='<title>DeliverProof · Verify before approval</title>'
          PID=""
          started=$(date +%s)
          : > "$OUT"
          note() { echo "$*" | tee -a "$OUT"; }
          sanitize() {
            sed -E \
              -e 's/\x1b\[[0-9;?]*[A-Za-z]//g' \
              -e 's/([Pp]rivate[ _-]?[Kk]ey[^0-9A-Fa-f]{0,20})(0x)?[0-9A-Fa-f]{64}/\1[REDACTED]/g' \
              -e 's/(gh[pousr]_|github_pat_)[A-Za-z0-9_]{20,}/[REDACTED]/g' \
              -e 's/npm_[A-Za-z0-9]{36}/[REDACTED]/g' "$1"
          }
          # Live (non-zombie) members of our process group.
          members() { ps -e -o pid=,pgid=,stat= | awk -v g="$PID" '$2 == g && $3 !~ /^Z/ { print $1 }'; }
          leader_alive() { [ -n "$PID" ] && ps -o stat= -p "$PID" 2>/dev/null | grep -qv '^Z'; }
          cleanup() {
            rc=$?
            trap - EXIT INT TERM
            if [ -n "$PID" ]; then
              if [ -n "$(members)" ]; then
                kill -TERM -- "-$PID" 2>/dev/null || true
                for _ in $(seq 1 60); do [ -z "$(members)" ] && break; sleep 0.25; done
                if [ -n "$(members)" ]; then
                  note "cleanup: group $PID ignored SIGTERM for 15s, sending SIGKILL"
                  kill -KILL -- "-$PID" 2>/dev/null || true
                  for _ in $(seq 1 20); do [ -z "$(members)" ] && break; sleep 0.25; done
                fi
              fi
              wait "$PID" 2>/dev/null || true
              if (exec 3<>"/dev/tcp/127.0.0.1/$PORT") 2>/dev/null; then
                note "::error::cleanup: something still answers on 127.0.0.1:$PORT"
                rc=1
              else
                note "cleanup: port $PORT released"
              fi
              left=$(members | tr '\n' ' ')
              if [ -n "$left" ]; then
                note "::error::cleanup: processes still alive in group $PID: $left"
                rc=1
              else
                note "cleanup: process group $PID has no live member"
              fi
            fi
            if [ -f "$RAW" ]; then
              sanitize "$RAW" > "$E/16-boot-server.log"
              rm -f "$RAW"
              echo "::group::next:start output (sanitized)"
              cat "$E/16-boot-server.log"
              echo "::endgroup::"
            fi
            note "boot_seconds=$(( $(date +%s) - started ))"
            note "boot_exit=$rc"
            exit "$rc"
          }
          trap cleanup EXIT
          trap 'note "interrupted by SIGINT"; exit 130' INT
          trap 'note "interrupted by SIGTERM"; exit 143' TERM
          fail() { note "::error::$*"; exit 1; }

          cd "$APP" || fail "generated app not found at $APP"
          test -f packages/nextjs/.next/BUILD_ID || fail "no production build (packages/nextjs/.next/BUILD_ID); next:build must pass first"
          note "next_build_id=$(cat packages/nextjs/.next/BUILD_ID)"
          note "port=$PORT host=127.0.0.1"
          # Something already answering on the port would make any 200 meaningless.
          if (exec 3<>"/dev/tcp/127.0.0.1/$PORT") 2>/dev/null; then
            fail "port $PORT on 127.0.0.1 is already in use before the app starts"
          fi

          # setsid makes the npm wrapper the leader of a new process group (PGID = PID),
          # so cleanup can stop npm, its shells and the Next server together.
          PORT="$PORT" setsid npm run next:start > "$RAW" 2>&1 < /dev/null &
          PID=$!
          pgid=""
          for _ in $(seq 1 50); do
            pgid=$(ps -o pgid= -p "$PID" 2>/dev/null | tr -d ' ')
            [ "$pgid" = "$PID" ] && break
            sleep 0.1
          done
          [ "$pgid" = "$PID" ] || fail "started process $PID did not become its own group leader (pgid=${pgid:-none})"
          note "server_pid=$PID pgid=$pgid"

          ready=""
          for _ in $(seq 1 120); do
            leader_alive || fail "next:start exited before answering (see 16-boot-server.log)"
            code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 5 "$BASE/" 2>/dev/null) || code=000
            if [ "$code" = "200" ]; then ready=yes; break; fi
            sleep 0.5
          done
          [ -n "$ready" ] || fail "no HTTP 200 on $BASE/ within the readiness limit (last status $code)"
          note "ready_after_seconds=$(( $(date +%s) - started ))"

          # The listening socket must belong to our process group, not another service.
          porthex=$(printf '%04X' "$PORT")
          inode=$(awk -v p="0100007F:$porthex" '$2 == p && $4 == "0A" { print $10; exit }' /proc/net/tcp)
          [ -n "$inode" ] || fail "no IPv4 listener on 127.0.0.1:$PORT in /proc/net/tcp"
          owner=""
          for p in $(members); do
            for fd in "/proc/$p/fd/"*; do
              if [ "$(readlink "$fd" 2>/dev/null)" = "socket:[$inode]" ]; then owner=$p; break 2; fi
            done
          done
          [ -n "$owner" ] || fail "listener on 127.0.0.1:$PORT (inode $inode) is not owned by process group $PID"
          note "listener_owner_pid=$owner cmd=$(ps -o args= -p "$owner" | cut -c1-120)"

          B="$RUNNER_TEMP/boot-body.html"
          H="$RUNNER_TEMP/boot-headers.txt"
          # No -L: a redirect is not accepted as the page.
          code=$(curl -sS -o "$B" -D "$H" -w '%{http_code}' --max-time 10 "$BASE/") || fail "GET / failed"
          note "get_root_status=$code bytes=$(wc -c < "$B")"
          [ "$code" = "200" ] || fail "GET / returned $code, expected 200"
          grep -qF "$TITLE" "$B" || fail "GET / did not contain the expected title"
          note "root_title=expected"
          grep -qi '^x-frame-options: *DENY' "$H" || fail "GET / lacks the app's X-Frame-Options header"
          grep -qi '^x-content-type-options: *nosniff' "$H" || fail "GET / lacks the app's X-Content-Type-Options header"
          note "root_security_headers=expected"

          asset=$(grep -oE '/_next/static/[A-Za-z0-9_./-]+\.js' "$B" | head -n1)
          [ -n "$asset" ] || fail "GET / referenced no /_next/static script"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$BASE$asset") || fail "GET $asset failed"
          note "get_static_script_status=$code path=$asset"
          [ "$code" = "200" ] || fail "GET $asset returned $code, expected 200"

          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$BASE/__boot-check-missing-route") || fail "GET missing route failed"
          note "get_missing_route_status=$code"
          [ "$code" = "404" ] || fail "an unknown route returned $code, expected 404"

          leader_alive || fail "next:start exited during the checks"
          note "server_alive_after_checks=yes"
          note "scope=production server boot and HTTP responses only; no wallet, Hedera, HCS or IPFS flow is exercised"

      - name: Record the registry again
        if: always()
        run: |
          set -uo pipefail
          E="$GITHUB_WORKSPACE/evidence"
          mkdir -p "$E"
          npm view "create-scaffold-hbar@$CLI_VERSION" version dist.integrity dist.shasum --json > "$E/15-cli-registry-after.json" 2>&1 || true
          cat "$E/15-cli-registry-after.json"

      - name: Scan the evidence for secrets
        id: scan
        if: always()
        run: |
          set -uo pipefail
          E="$GITHUB_WORKSPACE/evidence"
          mkdir -p "$E"
          if grep -rIlE -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' -e '(gh[pousr]_|github_pat_)[A-Za-z0-9_]{20,}' -e 'npm_[A-Za-z0-9]{36}' -e '[Pp]rivate[ _-]?[Kk]ey[^0-9A-Fa-f]{0,20}(0x)?[0-9A-Fa-f]{64}' "$E"; then
            echo "::error::a secret-like pattern remained in the evidence; nothing will be uploaded"
            exit 1
          fi
          echo "no secret-like pattern found"

      - name: Write the job summary
        if: always()
        run: |
          set -uo pipefail
          E="$GITHUB_WORKSPACE/evidence"
          v() { [ -f "$E/$1" ] && cat "$E/$1" || echo "not recorded"; }
          {
            echo "## DeliverProof public install check"
            echo
            echo "Official create-scaffold-hbar CLI, public template, GitHub-hosted runner, no secrets, no override."
            echo "This run does not deploy, send a transaction or upload to IPFS."
            echo "The boot check covers HTTP responses of the production server only, not wallet or Hedera flows."
            echo
            echo '```'
            v 01-context.txt
            echo "--- registry before"
            v 02-cli-registry-before.json
            echo "--- origin before"
            v 03-origin-before.txt
            echo "--- CLI"
            v 05-cli-exit.txt
            echo "--- origin after"
            v 06-origin-after.txt
            echo "--- generated tree"
            v 12-tree-summary.txt
            echo "--- documented checks"
            v 13-checks.txt
            echo "--- production boot on 127.0.0.1"
            v 17-boot-check.txt
            echo '```'
            echo
            echo "Full logs, file hashes and the template comparison are in the run artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the evidence
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-install-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90
